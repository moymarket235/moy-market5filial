<!doctype html>
<html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой Маркет</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="top"><div class="brand"><div class="logo">М</div><div><b>МОЙ МАРКЕТ</b><small>Көргөндө алгың келет!</small></div></div>
<a class="admin-link" href="admin.html">Admin</a></header>
<section class="hero"><h1>Мой Маркет</h1><p>Үйүңүзгө керектүү товарлар — бир жерде.</p><div class="search"><input id="search" placeholder="Товар издөө..."><button onclick="openCart()">🛒 <span id="cartCount">0</span></button></div></section>
<nav id="cats" class="cats"></nav><main><div id="grid" class="grid"></div><div id="empty" class="empty">Товар азырынча кошула элек.</div></main>
<div id="drawer" class="drawer"><div class="drawer-box"><button class="close" onclick="closeCart()">×</button><h2>🛒 Себет</h2><div id="cart"></div><div id="total"></div><button class="wa" onclick="order()">WhatsApp аркылуу заказ берүү</button></div></div>
<script>
const PHONE="996507668866"; let products=[], cats=[], cart=JSON.parse(localStorage.getItem("mm_cart")||"[]"), active="all";
const money=n=>new Intl.NumberFormat("ru-RU").format(n)+" сом";
async function init(){try{products=await (await fetch("products.json")).json();cats=await (await fetch("categories.json")).json()}catch(e){} renderCats();render()}
function renderCats(){catsEl.innerHTML='<button class="chip active" data-id="all">Баары</button>'+cats.map(c=>`<button class="chip" data-id="${c.id}">${c.name}</button>`).join("");document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{active=b.dataset.id;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()})}
const catsEl=document.getElementById("cats");
function render(){let q=document.getElementById("search").value.toLowerCase();let a=products.filter(p=>(active==="all"||p.category===active)&&((p.name||"")+" "+(p.description||"")).toLowerCase().includes(q));grid.innerHTML=a.map((p,i)=>`<article class="card"><div class="pic"><img src="${p.image||'assets/products/placeholder.svg'}" alt=""></div><div class="cardbody"><span>${p.categoryName||""}</span><h3>${p.name}</h3><p>${p.description||""}</p><strong>${money(p.price)}</strong><button onclick="add(${i},'${p.id}')">Онлайн заказ</button></div></article>`).join("");empty.style.display=a.length?"none":"block"}
function add(_,id){let p=products.find(x=>x.id===id);let x=cart.find(x=>x.id===id);x?x.qty++:cart.push({...p,qty:1});save();openCart()}
function save(){localStorage.setItem("mm_cart",JSON.stringify(cart));cartCount.textContent=cart.reduce((s,x)=>s+x.qty,0)}
function openCart(){drawer.classList.add("show");renderCart()} function closeCart(){drawer.classList.remove("show")}
function renderCart(){cart.innerHTML=cart.length?cart.map(x=>`<div class="row"><div><b>${x.name}</b><small>${x.qty} × ${money(x.price)}</small></div><div><button onclick="chg('${x.id}',-1)">−</button><button onclick="chg('${x.id}',1)">+</button></div></div>`).join(""):"<p>Себет бош.</p>";let t=cart.reduce((s,x)=>s+x.price*x.qty,0);total.innerHTML=cart.length?`<h3>Жалпы: ${money(t)}</h3>`:""}
function chg(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>y.id!==id);save();renderCart()}
function order(){if(!cart.length)return;let t=cart.reduce((s,x)=>s+x.price*x.qty,0);let msg="Саламатсызбы! Мой Маркеттен онлайн заказ:%0A"+cart.map(x=>`• ${x.name} — ${x.qty} даана × ${x.price} сом = ${x.price*x.qty} сом`).join("%0A")+`%0A%0AЖалпы: ${t} сом`;location.href=`https://wa.me/${PHONE}?text=${msg}`}
search.oninput=render;init();save();
</script></body></html>
