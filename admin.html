<!doctype html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой Маркет — Secure Admin</title><link rel="stylesheet" href="style.css"><style>
body{min-height:100vh}.admin-page{max-width:1100px;margin:auto;padding:30px 4% 60px}.panel{background:#0b1118;border:1px solid #26323e;border-radius:20px;padding:22px;margin-bottom:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select,textarea{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;border:1px solid #34414d;background:#0e161f;color:#fff}textarea{min-height:90px}.full{grid-column:1/-1}.btn{border:0;border-radius:11px;padding:12px 17px;background:linear-gradient(135deg,#ff7a00,#ff4d00);color:#fff;font-weight:800}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #24303b}.muted{color:#929da8}.status{padding:12px;border-radius:10px;background:#101923;margin-bottom:12px;display:none}.status.show{display:block}@media(max-width:650px){.form{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-direction:column}}
</style></head><body><header class="top"><a class="brand" href="index.html"><div class="logo"><img src="assets/brand-logo.webp"></div><div class="brand-text"><b>МОЙ МАРКЕТ</b><small>Коопсуз башкаруу панели</small></div></a></header>
<main class="admin-page"><div id="status" class="status"></div><section id="login" class="panel"><h2>🔐 Admin кирүү</h2><p class="muted">GitHub OAuth аркылуу коопсуз кирүү.</p><a class="admin-link" href="https://YOUR-WORKER.workers.dev/auth/login">GitHub менен кирүү</a></section>
<div id="app" style="display:none"><h1>⚙️ Башкаруу панели</h1><p id="who" class="muted"></p><button class="btn" onclick="logout()">Чыгуу</button>
<section class="panel"><h2>➕ Товар кошуу</h2><div class="form"><input id="name" placeholder="Товардын аталышы"><input id="price" type="number" placeholder="Баасы, сом"><select id="cat"></select><input id="sub" placeholder="Подкатегория"><textarea id="desc" class="full" placeholder="Сүрөттөмө"></textarea><input id="image" type="file" accept="image/*" class="full"><button class="btn full" onclick="addProduct()">Товарды сайтка чыгаруу</button></div></section>
<section id="adminBox" class="panel" style="display:none"><h2>👥 Администраторлор — 10 орун</h2><div class="form"><input id="newAdmin" placeholder="GitHub username"><button class="btn" onclick="addAdmin()">Администратор кошуу</button></div><div id="admins"></div></section>
<section class="panel"><h2>📦 Товарлар</h2><div id="products"></div></section></div></main>
<script>
const API="https://YOUR-WORKER.workers.dev";const $=x=>document.getElementById(x);function msg(x){$('status').textContent=x;$('status').classList.add('show');setTimeout(()=>$('status').classList.remove('show'),4000)}
async function api(p,o={}){let r=await fetch(API+p,{credentials:'include',...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Ката');return d}
async function init(){try{let d=await api('/api/me');$('login').style.display='none';$('app').style.display='block';$('who').textContent='@'+d.user.login+(d.user.owner?' · Негизги админ':'');if(d.user.owner){$('adminBox').style.display='block';loadAdmins()}load()}catch{}}
async function load(){let d=await api('/api/catalog');$('cat').innerHTML=d.categories.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('products').innerHTML=d.products.length?d.products.map(x=>`<div class="row"><b>${x.name}<small class="muted"> — ${x.price} сом</small></b></div>`).join(''):'<p class="muted">Товар жок.</p>'}
async function addProduct(){let f=$('image').files[0];if(!f)return msg('Сүрөт тандаңыз.');let fd=new FormData();['name','price'].forEach(k=>fd.append(k,$(k).value));fd.append('category',$('cat').value);fd.append('subcategory',$('sub').value);fd.append('description',$('desc').value);fd.append('image',f);try{await api('/api/products',{method:'POST',body:fd});msg('✅ Товар кошулду');load()}catch(e){msg(e.message)}}
async function loadAdmins(){let d=await api('/api/admins');$('admins').innerHTML=d.admins.map(a=>`<div class="row"><b>@${a.login}</b>${a.owner?'':'<button class="btn" onclick="delAdmin(\''+a.login+'\')">Өчүрүү</button>'}</div>`).join('')}
async function addAdmin(){try{await api('/api/admins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('newAdmin').value})});$('newAdmin').value='';loadAdmins();msg('Админ кошулду')}catch(e){msg(e.message)}}
async function delAdmin(x){if(!confirm('Өчүрөлүбү?'))return;await api('/api/admins/'+encodeURIComponent(x),{method:'DELETE'});loadAdmins()}
async function logout(){await api('/auth/logout',{method:'POST'});location.reload()}init();
</script></body></html>
